name: "Mirror linux-stable from kernel.org"

# Exact mirror of the kernel.org linux-stable tree (every branch + tag) into
# this repo, so Armbian can fetch mainline/stable kernels from a GitHub mirror
# we control instead of the gregkh mirror (whose linux-*.y branches lag).
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-sync
  cancel-in-progress: false

env:
  UPSTREAM: "https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"

jobs:
  sync:
    if: ${{ github.repository_owner == 'armbian' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: "Mirror every branch + tag from kernel.org"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          target="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Seed from our own mirror (fast, same host) to stay incremental;
          # fall back to a full clone from upstream on the first run.
          git clone --mirror "${target}" m.git || git clone --mirror "${UPSTREAM}" m.git
          cd m.git
          git remote add up "${UPSTREAM}" 2>/dev/null || git remote set-url up "${UPSTREAM}"
          git fetch --force --prune --tags up '+refs/heads/*:refs/heads/*'

          # GitHub refuses a single multi-GB push (HTTP 500 / disconnect). If the
          # mirror has no master yet, seed master's history in commit-chunks so
          # each pack stays small; every other branch then shares that history and
          # pushes as a tiny delta. Subsequent runs skip this entirely.
          if ! git ls-remote --exit-code "${target}" refs/heads/master >/dev/null 2>&1; then
            echo "First seed: pushing master history in chunks..."
            mapfile -t C < <(git rev-list --reverse --first-parent master)
            total=${#C[@]}; step=5000
            for ((i=step; i<total; i+=step)); do
              echo "  master: ${i}/${total}"
              git push --quiet --force "${target}" "${C[$i]}:refs/heads/master"
            done
          fi

          # Now an exact copy of every branch + tag. No blanket --prune on
          # refs/heads/* so the 'armbian-mirror' branch (this workflow) survives.
          git push --force          "${target}" 'refs/heads/master:refs/heads/master'
          git push --force --prune  "${target}" 'refs/heads/linux-*:refs/heads/linux-*'
          # Tags in batches — pushing ~11.6k refs at once exceeds GitHub's limit.
          # Objects already arrived with the branches, so these are cheap ref updates.
          mapfile -t T < <(git for-each-ref --format='%(refname)' refs/tags)
          for ((i=0; i<${#T[@]}; i+=200)); do
            echo "  tags: ${i}/${#T[@]}"
            git push --force "${target}" "${T[@]:i:200}"
          done

          echo "linux-6.18.y -> $(git rev-parse refs/heads/linux-6.18.y 2>/dev/null || echo n/a)" >> "$GITHUB_STEP_SUMMARY"

  keepalive:
    if: ${{ github.repository_owner == 'armbian' }}
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1.2.1
